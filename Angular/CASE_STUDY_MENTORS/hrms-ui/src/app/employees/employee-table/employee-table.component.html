<div class="container">
  <h3 class="italic-text">Welcome, Johny</h3>

  <div class="search-container">
    <input
      type="text"
      class="search-input"
      [(ngModel)]="employeeSearch"
      placeholder="Search Employee"
    />
    <input
      type="text"
      class="search-input"
      [(ngModel)]="departmentSearch"
      placeholder="Search by Department"
    />

    <button (click)="searchEmployees()">Search</button>

    <button class="add-employee-button" (click)="createEmployee()">
      Add New Employee
    </button>
  </div>

  <div class="table-container">
    <h2>Employee Table</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Name</th>
          <th>Email</th>
          <th>Department</th>
          <th>Manager</th>
          <th>Status</th>
          <th>Change Status</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let employee of employees">
          <td>{{ employee.id }}</td>
          <td>{{ employee.name }}</td>
          <td>{{ employee.email }}</td>
          <td>{{ employee.departmentId }}</td>
          <td>{{ employee.manager }}</td>
          <td>{{ employee.status }}</td>
          <td>
            <button (click)="editEmployee(employee.id)">Edit</button>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
